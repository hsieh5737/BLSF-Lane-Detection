%YAML:1.0
---
# Numeric parameters of the original public release (830a62f): BEV 640x480,
# MLT 11, T1 20, under the CORRECTED logic. It does not reproduce the original
# behaviour (hybrid input, 5-degree exclusion and 12-degree expansion are
# rejected by this version). Kept only to trace historical differences.
ipm:
  bev_width: 640
  bev_height: 480
  roi_w_over_l: 0.75   # ground ROI 3:4 (width:length); sx/sy = 1.78 on this grid

gray:
  w_r: 0.5
  w_g: 0.4
  w_b: 0.1

mlt:
  median_ksize: 11
  offset_t: 15

lsd:
  min_len: 20.0
  min_abs_angle: 0.0
  max_abs_angle: 35.0

blsf:
  enabled: 1
  a0_lo: -35.0
  a0_hi: 0.0
  a1_lo: -5.0
  a1_hi: 5.0
  a2_lo: 0.0
  a2_hi: 35.0
  delta_theta: 0.0
  min_total_vote: 300.0
  draw_thickness: 2

features:
  source: "segments_mask"

peaks:
  smooth_ksize: 9
  min_peak_value: 50

tracker:
  n_windows: 12
  margin: 60
  minpix: 40

ransac:
  iters: 200
  inlier_thresh: 10.0
  min_inliers: 80
